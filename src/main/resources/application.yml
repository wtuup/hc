server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fresh_sales_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456   # 改成你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 如果有密码，添加 password: yourpassword
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.freshsales.entity

jwt:
  secret: freshSalesSystem2026SecretKeyForJWT
  expiration: 86400000

inventory:
  warning-threshold: 10

upload:
  path: ./uploads/images/